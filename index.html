<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>과학상자 조립 시뮬레이터</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #1a1d21; --panel: #23272e; --border: #3a3f47;
    --text: #e6e8ea; --dim: #9aa0a8; --accent: #4da3ff; --warn: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'Segoe UI', 'Malgun Gothic', sans-serif; background: var(--bg); color: var(--text); display: flex; }

  #sidebar { width: 230px; min-width: 230px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #sidebar h1 { font-size: 15px; padding: 12px 14px; border-bottom: 1px solid var(--border); }
  #palette { flex: 1; overflow-y: auto; padding: 8px; }
  .pal-group { font-size: 11px; color: var(--dim); margin: 10px 6px 4px; letter-spacing: .5px; }
  .pal-item { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; margin: 2px 0; border-radius: 6px; cursor: pointer; font-size: 13px; border: 1px solid transparent; }
  .pal-item:hover { background: #2c313a; border-color: var(--border); }
  .pal-item .qty { font-size: 11px; color: var(--dim); }
  .pal-item .qty.over { color: var(--warn); font-weight: bold; }

  #main { flex: 1; position: relative; }
  #viewport { width: 100%; height: 100%; display: block; }

  #toolbar { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; }
  #toolbar button { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  #toolbar button:hover { border-color: var(--accent); }
  #toolbar button.active { background: var(--accent); color: #10141a; border-color: var(--accent); }

  #status { position: absolute; bottom: 0; left: 0; right: 0; padding: 6px 12px; font-size: 12px; color: var(--dim); background: rgba(26,29,33,.85); pointer-events: none; }
  #help { position: absolute; top: 10px; right: 10px; background: rgba(35,39,46,.92); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--dim); line-height: 1.8; }
  #help b { color: var(--text); }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="sidebar">
    <h1>과학상자 6호 · 부품</h1>
    <div id="palette"></div>
  </div>
  <div id="main">
    <canvas id="viewport"></canvas>
    <div id="toolbar">
      <button id="btn-bolt" title="B">🔩 볼트 모드</button>
      <button id="btn-rotate" title="R">↻ 회전 90°</button>
      <button id="btn-tilt" title="F">⤴ 세우기 90°</button>
      <button id="btn-delete" title="Del">🗑 삭제</button>
    </div>
    <div id="help">
      <b>드래그</b> 이동 · <b>Shift+드래그</b> 세로 이동 (구멍/축 자동 스냅)<br>
      <b>R</b> 회전 · <b>F</b> 세우기 · <b>Q/E</b> 높이 (Shift: 미세)<br>
      <b>B</b> 볼트 모드 → 링 클릭: <span style="color:#ffd54a">볼트</span> <span style="color:#4dd0e1">클립(기어·축)</span> <span style="color:#da70d6">베어링(축·판)</span><br>
      <b>, / .</b> 축·기어 회전 구동 · <b>Del</b> 삭제 · 빈 곳 드래그: 카메라
    </div>
    <div id="status">부품을 팔레트에서 클릭해 추가하세요.</div>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
